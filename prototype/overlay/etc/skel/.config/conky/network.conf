local hud = dofile('/usr/share/nexus/conky/common.lua')

conky.config = hud.config(270, 130)

local c = hud.colors()
local iface = hud.command('nexus-info iface') or 'wlan0'

conky.text = '${color0}' .. hud.font(9) .. '// NETWORK${alignr}${color2}' .. iface .. '${font}\n'
  .. '${color5}${hr 1}\n'
  .. '${color1}WIFI ${color0}${execi 10 nexus-info wifi}\n'
  .. '${color1}IP   ${color0}${execi 30 nexus-info ip}\n'
  .. '${color1}DN ${color0}${downspeed ' .. iface .. '}${alignr}${color1}UP ${color0}${upspeed ' .. iface .. '}\n'
  .. '${downspeedgraph ' .. iface .. ' 18,0 ' .. c.secondary .. ' ' .. c.primary .. '}\n'
  .. '${color1}${execi 15 nexus-info bluetooth}\n'
  .. '${color3}${execi 30 nexus-info vpn}'
