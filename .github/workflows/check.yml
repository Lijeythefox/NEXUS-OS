name: Check NEXUS OS

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Scripts, configs and unit tests
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 10
    steps:
      - name: Install checkers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates shellcheck lua5.4 jq python3 librsvg2-bin
      - name: Check out NEXUS OS
        uses: actions/checkout@v5
      - name: Run static checks and unit tests
        run: bash ci/check-static.sh

  desktop:
    name: Packages and Hyprland config
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out NEXUS OS
        uses: actions/checkout@v5

      - name: Install packages and verify the configs in a clean Debian
        run: |
          mkdir -p ci-out
          docker run --rm -v "$PWD:/src" -w /src debian:trixie bash ci/desktop-check.sh

      - name: Show results
        if: always()
        run: cat ci-out/result.txt || true

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-check
          path: ci-out/
          if-no-files-found: ignore
          retention-days: 14
