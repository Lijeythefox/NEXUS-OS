local hud = dofile('/usr/share/nexus/conky/common.lua')

conky.config = hud.config(270, 130)

local callsign = hud.read('/etc/nexus/callsign') or 'NEXUS'
local time_format = hud.setting('CLOCK_24H', '1') == '1' and '%H:%M' or '%I:%M %p'
local date_format = hud.setting('DATE_FORMAT', '%d %b %Y')

conky.text = '${color0}' .. hud.font(9) .. '// ' .. callsign .. '${alignr}${color2}CHRONO${font}\n'
  .. '${color5}${hr 1}\n'
  .. '${color0}' .. hud.font(30) .. '${time ' .. time_format .. '}${font}\n'
  .. '${color1}${time ' .. date_format .. '}${alignr}${color2}${time %A}\n'
  .. '${color3}${execi 900 nexus-weather}'
