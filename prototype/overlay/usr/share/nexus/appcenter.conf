# NEXUS App Center catalogue (Settings > Apps > App Center).
#
# Each [section] is one entry. To offer another app, add a section and push.
#   kind=builtin  already in the image; shows Open (and Make default for browsers)
#   kind=apt      installs the Debian stable packages listed in packages=
#   kind=core     downloads the RetroArch cores listed in cores= and makes a
#                 ROM folder for each ES-DE system listed in systems=
#   launch=       the .desktop file that Open starts (apt entries find it
#                 themselves if this is left out)
#   browser=1     shows a Make default button

[chromium]
name=Chromium
category=Browsers
kind=builtin
launch=chromium.desktop
browser=1
description=Built in. Best video and graphics speed on ARM. Web apps open in their own window.

[firefox-esr]
name=Firefox ESR
category=Browsers
kind=apt
packages=firefox-esr
launch=firefox-esr.desktop
browser=1
description=Mozilla's long-term support browser from Debian stable. Good for privacy and add-ons.

[epiphany]
name=GNOME Web
category=Browsers
kind=apt
packages=epiphany-browser
launch=org.gnome.Epiphany.desktop
browser=1
description=Simple, light browser from Debian stable. Can also turn sites into web apps.

[falkon]
name=Falkon
category=Browsers
kind=apt
packages=falkon
launch=org.kde.falkon.desktop
browser=1
description=Light browser from Debian stable with a built-in ad blocker.

[supertuxkart]
name=SuperTuxKart
category=Games
kind=apt
packages=supertuxkart
description=Kart racing with Tux and friends. Works with the controller. Use low graphics on the Zero 3W.

[supertux]
name=SuperTux
category=Games
kind=apt
packages=supertux
description=Classic side-scrolling platformer. Works with the controller.

[luanti]
name=Luanti (block building)
category=Games
kind=apt
packages=luanti luanti-game-minetest
description=Minecraft-style mining and building, much lighter than Minecraft. Works with the controller.

[openttd]
name=OpenTTD
category=Games
kind=apt
packages=openttd openttd-opengfx openttd-openmsx
description=Build a transport empire with trains, buses, ships and planes. Best with the trackpad.

[wesnoth]
name=Battle for Wesnoth
category=Games
kind=apt
packages=wesnoth
description=Turn-based fantasy strategy with long campaigns. Best with touch or the trackpad.

[neverball]
name=Neverball and Neverputt
category=Games
kind=apt
packages=neverball neverputt
description=Tilt the floor to roll the ball, plus mini golf. Works with the controller.

[extremetuxracer]
name=Extreme Tux Racer
category=Games
kind=apt
packages=extremetuxracer
description=Slide downhill as Tux and grab the herring. Works with the controller.

[hedgewars]
name=Hedgewars
category=Games
kind=apt
packages=hedgewars
description=Turn-based hedgehog artillery battles, like Worms. Up to 8 players on one deck.

[aisleriot]
name=Solitaire
category=Casual games
kind=apt
packages=aisleriot
description=Over 80 card games: Klondike, Spider, FreeCell and more.

[gnome-mines]
name=Mines
category=Casual games
kind=apt
packages=gnome-mines
description=Minesweeper. Long-press to place a flag on the touchscreen.

[gnome-sudoku]
name=Sudoku
category=Casual games
kind=apt
packages=gnome-sudoku
description=Sudoku with endless puzzles from easy to very hard.

[gnome-mahjongg]
name=Mahjongg
category=Casual games
kind=apt
packages=gnome-mahjongg
description=Match pairs of tiles to clear the board.

[gnome-chess]
name=Chess
category=Casual games
kind=apt
packages=gnome-chess stockfish
description=Chess against the Stockfish engine or a friend.

[gnome-2048]
name=2048
category=Casual games
kind=apt
packages=gnome-2048
description=Slide and merge the numbered tiles.

[emu-atari]
name=Atari 2600, 7800 and Lynx
category=Emulators
kind=core
cores=stella prosystem handy
systems=atari2600 atari7800 atarilynx
description=Full speed. Games go in ROMs/atari2600, ROMs/atari7800 and ROMs/atarilynx.

[emu-pcengine]
name=PC Engine / TurboGrafx-16
category=Emulators
kind=core
cores=mednafen_pce_fast
systems=pcengine pcenginecd
description=Full speed. CD games go in ROMs/pcenginecd and need syscard3.pce in ROMs/bios.

[emu-wonderswan]
name=WonderSwan and WonderSwan Color
category=Emulators
kind=core
cores=mednafen_wswan
systems=wonderswan wonderswancolor
description=Full speed. Games go in ROMs/wonderswan and ROMs/wonderswancolor.

[emu-nds]
name=Nintendo DS
category=Emulators
kind=core
cores=melonds
systems=nds
description=Lighter 2D games are playable on the Zero 3W, 3D games are often slow. Games go in ROMs/nds.

[emu-dos]
name=DOS games
category=Emulators
kind=core
cores=dosbox_pure
systems=dos
description=Old PC games. Put each game's .zip straight into ROMs/dos.

[emu-scummvm]
name=ScummVM (point-and-click adventures)
category=Emulators
kind=core
cores=scummvm
systems=scummvm
description=Monkey Island, Day of the Tentacle and friends. One folder per game in ROMs/scummvm.
