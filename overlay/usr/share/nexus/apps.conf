# Apps that nexus-apps can install after NEXUS OS is set up (none of them are in the image).
#
# One [section] per app. The section name is the app's short id.
#   name     shown in the picker
#   about    a few words shown next to the name
#   default  yes = ticked in the picker, no = listed but not ticked
#   arch     amd64 = PC only. Leave it out when the app works on PCs and ARM boards
#   apt      Debian packages to install (space separated)
#   pipx     Python tools installed for the user with pipx
#   repo_key / repo_keyfile / repo_line   an extra apt repository (key download, where the key goes, sources line)
#   github   owner/repo whose latest release holds the app
#   gitlab   group/project on gitlab.com whose latest release holds the app
#   amd64_file / arm64_file   pattern (regular expression) of the release file for each machine
#   prerelease  yes = also look at test releases (some apps only publish those)
#   kind     what the downloaded file is: deb, appimage or zip (a zip with one program in it)
#   command  the command name the app gets (for appimage and zip)
#   icon     icon name for the app list (for zip)
#   services_off  systemd units to switch off after installing
#   setup    a NEXUS setup step to run after installing (samba-roms)
#
# Edit this file to change what is offered. `nexus-apps check` tells you if something is wrong in it.

# ---------------------------------------------------------------- ticked by default

[chromium]
name = Chromium
about = web browser
default = yes
apt = chromium

[vscode]
name = VS Code
about = code editor
default = yes
repo_key = https://packages.microsoft.com/keys/microsoft.asc
repo_keyfile = /etc/apt/keyrings/microsoft.asc
repo_line = deb [arch=amd64,arm64 signed-by=/etc/apt/keyrings/microsoft.asc] https://packages.microsoft.com/repos/code stable main
apt = code

[pico-tools]
name = Pico tools
about = mpremote and picotool, for Raspberry Pi Picos
default = yes
apt = picotool pipx
pipx = mpremote

[python-tools]
name = Python tools
about = pip, venv and pipx
default = yes
apt = python3-pip python3-venv pipx

[tailscale]
name = Tailscale
about = private network to your home PC
default = yes
repo_key = https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
repo_keyfile = /usr/share/keyrings/tailscale-archive-keyring.gpg
repo_line = deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian trixie main
apt = tailscale

[terminal-tools]
name = Terminal tools
about = btop, fastfetch, lazygit, git, ripgrep, fd, bat, fzf
default = yes
apt = btop fastfetch lazygit git ripgrep fd-find bat fzf

[everyday]
name = Everyday apps
about = pictures, video and music, PDFs, notes, calculator
default = yes
apt = imv mpv evince mousepad gnome-calculator

[ssh-server]
name = SSH server
about = log in from another computer (stays off until you switch it on)
default = yes
apt = openssh-server
services_off = ssh.service ssh.socket

# ---------------------------------------------------------------- extras (not ticked)

[godot]
name = Godot 4
about = game engine
default = no
github = godotengine/godot
amd64_file = ^Godot_v[0-9.]+-stable_linux\.x86_64\.zip$
arm64_file = ^Godot_v[0-9.]+-stable_linux\.arm64\.zip$
kind = zip
command = godot
icon = applications-games

[thonny]
name = Thonny
about = simple Python editor for Picos
default = no
apt = thonny

[prism]
name = Prism Launcher
about = Minecraft (Java 21 included)
default = no
apt = openjdk-21-jre
github = PrismLauncher/PrismLauncher
amd64_file = ^PrismLauncher-Linux-x86_64\.AppImage$
arm64_file = ^PrismLauncher-Linux-aarch64\.AppImage$
kind = appimage
command = prismlauncher

[retroarch]
name = RetroArch
about = retro game emulators: NES, SNES, Game Boy (Color, Advance) and DS
default = no
apt = retroarch libretro-core-info libretro-nestopia libretro-bsnes-mercury-performance libretro-mgba libretro-gambatte libretro-desmume

[es-de]
name = ES-DE
about = game menu for your retro games (works with RetroArch)
default = no
gitlab = es-de/emulationstation-de
amd64_file = ES-DE_x64\.AppImage$
arm64_file = ES-DE_aarch64\.AppImage$
kind = appimage
command = es-de

[iris]
name = Iris
about = your AI desktop companion
default = no
apt = gnome-keyring libsecret-tools
github = Lijeythefox/IRIS
amd64_file = _amd64\.deb$
arm64_file = _arm64\.deb$
kind = deb

[kicad]
name = KiCad
about = circuit board design
default = no
apt = kicad

[arduino-ide]
name = Arduino IDE 2
about = Arduino editor (PC only)
default = no
arch = amd64
github = arduino/arduino-ide
amd64_file = _Linux_64bit\.AppImage$
kind = appimage
command = arduino-ide

[bambu-studio]
name = Bambu Studio
about = slicer for the Bambu Lab printer (PC only)
default = no
arch = amd64
github = bambulab/BambuStudio
amd64_file = ^Bambu_Studio_ubuntu-24\.04.*\.AppImage$
kind = appimage
command = bambu-studio

[libreoffice]
name = LibreOffice
about = documents, spreadsheets, slides
default = no
apt = libreoffice-writer libreoffice-calc libreoffice-impress libreoffice-gtk3

[freetube]
name = FreeTube
about = YouTube without ads or tracking
default = no
github = FreeTubeApp/FreeTube
prerelease = yes
amd64_file = _amd64\.deb$
arm64_file = _arm64\.deb$
kind = deb

[legcord]
name = Legcord
about = Discord
default = no
github = Legcord/Legcord
amd64_file = -linux-amd64\.deb$
arm64_file = -linux-arm64\.deb$
kind = deb

[remmina]
name = Remmina
about = remote desktop to other computers
default = no
apt = remmina remmina-plugin-rdp remmina-plugin-vnc

[timeshift]
name = Timeshift
about = snapshots to undo system changes
default = no
apt = timeshift

[samba-roms]
name = ROMs share
about = share your ROMs folder with other computers (Samba)
default = no
apt = samba
setup = samba-roms
