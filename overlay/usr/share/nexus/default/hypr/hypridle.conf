# When the desktop dims, locks and turns the screen off (seconds).
general {
    lock_cmd = nexus-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = nexus-screen on
}

listener {
    timeout = 240
    on-timeout = brightnessctl -s set 30%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360
    on-timeout = nexus-screen off
    on-resume = nexus-screen on
}
