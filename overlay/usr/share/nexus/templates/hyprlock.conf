# Lock screen. Filled in by nexus-theme; do not edit.
general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/nexus/wallpaper
    color = rgb({{bg_hex}})
    blur_passes = 3
    blur_size = 6
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = JetBrains Mono
    color = rgb({{fg_hex}})
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    font_size = 16
    font_family = JetBrains Mono
    color = rgb({{muted_hex}})
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 13
    font_family = JetBrains Mono
    color = rgb({{fg_hex}})
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 46
    rounding = 23
    outline_thickness = 2
    outer_color = rgb({{accent_hex}})
    inner_color = rgb({{surface_hex}})
    font_color = rgb({{fg_hex}})
    check_color = rgb({{yellow_hex}})
    fail_color = rgb({{urgent_hex}})
    placeholder_text = Password
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}
