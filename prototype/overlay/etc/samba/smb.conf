[global]
   workgroup = WORKGROUP
   server string = NEXUS deck
   server role = standalone server
   security = user
   map to guest = never
   server min protocol = SMB2
   disable netbios = yes
   smb ports = 445
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[ROMs]
   comment = NEXUS games folder on the micro SD card
   path = /mnt/sdcard/ROMs
   browseable = yes
   read only = no
   valid users = @sudo
   create mask = 0664
   directory mask = 0775
